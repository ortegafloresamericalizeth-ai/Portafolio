<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portafolio digital</title>
<style>
:root{--bg:#fdf4fa;--sf:#ffffff;--ink:#3a3450;--mute:#6f6a85;--line:#eadff3;--ac:#c9bdf7;--acink:#2f2760;--link:#6246c9;--p1:#ffd1e3;--p2:#cfe6ff;--p3:#bfe8d6;--p4:#ffe3c9;--p5:#e3d8ff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#241f36;--sf:#2e2945;--ink:#f1ecff;--mute:#b4accf;--line:#433c63;--ac:#b8a9f0;--acink:#231a4d;--link:#c9bdf7;--p1:#5a3a52;--p2:#33496a;--p3:#2f5648;--p4:#5e4635;--p5:#4a3d73;color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:linear-gradient(180deg,var(--p1) 0,var(--bg) 380px) fixed,var(--bg);color:var(--ink);font:400 1rem/1.6 system-ui,"Segoe UI",sans-serif}
a{color:var(--link)}
header{position:sticky;top:0;z-index:5;background:var(--sf);box-shadow:0 2px 0 var(--p5);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;flex-wrap:wrap}
header strong{font-size:1.05rem}
nav{display:flex;gap:16px;flex-wrap:wrap}nav a{text-decoration:none;color:var(--ink);font-weight:600;font-size:.92rem}nav a:hover{color:var(--link)}
section{max-width:1000px;margin:auto;padding:56px 24px 10px}
h2{font-size:1.7rem;margin:0 0 6px}.lead{color:var(--mute);margin:0 0 20px}
.hero{display:flex;gap:30px;align-items:center;padding-top:64px}
.hero img{width:150px;height:150px;border-radius:50%;object-fit:cover;flex:none;border:4px solid var(--p5)}
.hero .ini{width:150px;height:150px;border-radius:50%;flex:none;background:var(--ac);color:var(--acink);display:grid;place-items:center;font-size:3.4rem;font-weight:700}
.hero h1{font-size:2.5rem;line-height:1.1;margin:0 0 6px}.hero p{margin:0 0 16px;color:var(--mute);font-size:1.1rem}
.btn{display:inline-block;font:inherit;font-weight:600;background:var(--ac);color:var(--acink);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--p2);color:var(--ink)}
.btn:hover{filter:brightness(.96)}
a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.box{background:var(--sf);border:2px solid var(--p5);border-radius:18px;padding:18px}
#viewer{width:100%;height:640px;border:2px solid var(--p5);border-radius:12px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--line);border-top:6px solid var(--p1);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1.1rem}.meta{font-size:.82rem;color:var(--mute)}
.chip{display:inline-block;font-size:.76rem;font-weight:600;background:var(--p4);border-radius:99px;padding:1px 9px;margin-right:4px}
.chip.st{background:var(--p3);color:var(--ink)}
.card:nth-child(5n+2){border-top-color:var(--p2)}.card:nth-child(5n+3){border-top-color:var(--p3)}.card:nth-child(5n+4){border-top-color:var(--p4)}.card:nth-child(5n+5){border-top-color:var(--p5)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--mute);text-align:center;grid-column:1/-1}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:50px 24px 40px}
@media(max-width:700px){.hero{flex-direction:column;text-align:center}.hero h1{font-size:2rem}#viewer{height:480px}}
</style></head>
<body>
<header><strong id="hn">Mi portafolio</strong>
<nav><a href="#inicio">Inicio</a><a href="#cv">Mi CV</a><a href="#proyectos">Proyectos</a><a href="#contacto">Contacto</a></nav></header>

<section id="inicio" class="hero">
  <div id="avatar"></div>
  <div><h1 id="nombre"></h1><p id="titulo"></p><p id="resumen" style="font-size:1rem"></p>
  <a class="btn" href="#cv">Ver mi CV</a> <a class="btn alt" href="#proyectos">Ver proyectos</a></div>
</section>

<section id="cv">
  <h2>Mi CV</h2>
  <p class="lead">Aquí puedes ver y descargar mi currículum.</p>
  <div class="box">
    <iframe id="viewer" title="Vista previa del CV" hidden></iframe>
    <p class="lead" id="nocv" style="margin:0">Mi CV estará disponible próximamente.</p>
    <div class="row" id="acts" hidden><a class="btn" href="cv.pdf" download="CV.pdf">Descargar CV</a></div>
  </div>
</section>

<section id="proyectos"><h2>Proyectos</h2><p class="lead">Mis proyectos más recientes.</p><div class="grid" id="plist"></div></section>

<section id="contacto"><h2>Contacto</h2><div class="row" id="links"></div></section>
<footer>Portafolio digital</footer>

<script>
/* ============ TUS DATOS: edita solo esta parte ============ */
const S={
  cv:{
    nombre:"AMERICA LIZETH ORTEGA FLORES",
    titulo:"Estudiante de nivel superior",
    resumen:"Hola! Soy estudiante del Tecnológico de Estudios Superiores de San Felipe del Progreso.",
    correo:"",
    github:"",
    linkedin:"",
    foto:"foto.jpg"
  },
  proj:[
    {nombre:"Modelo de IA de mantenimiento preventivo para plantas de sector transporte",tipo:"Software",estado:"Finalizado",contexto:"Programación, Ingeniería, Electrónica",fecha:"Junio-Julio 2026",problema:"Mantenimiento preventivo y correctivo",tecnologias:"GitBash",enlace:""}
  ]
};
/* ========================================================== */

const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const c=S.cv;

/* Datos personales */
$("#nombre").textContent=c.nombre;$("#hn").textContent=c.nombre;
document.title=c.nombre+" | Portafolio";
$("#titulo").textContent=c.titulo;
$("#resumen").textContent=c.resumen;
const inicial='<div class="ini">'+esc((c.nombre||"T").trim()[0].toUpperCase())+'</div>';
$("#avatar").innerHTML=inicial;
if(c.foto){
  const im=new Image();im.alt="Foto de perfil";
  im.onload=function(){$("#avatar").innerHTML="";$("#avatar").appendChild(im)};
  im.src=c.foto;
}

/* Contacto */
const toUrl=u=>/^https?:\/\//.test(u)?u:"https://"+u;
const L=[];
if(c.correo)L.push('<a class="btn alt" href="mailto:'+esc(c.correo)+'">'+esc(c.correo)+'</a>');
if(c.github)L.push('<a class="btn alt" target="_blank" rel="noopener" href="'+esc(toUrl(c.github))+'">GitHub</a>');
if(c.linkedin)L.push('<a class="btn alt" target="_blank" rel="noopener" href="'+esc(toUrl(c.linkedin))+'">LinkedIn</a>');
$("#links").innerHTML=L.join("")||'<p class="lead">Próximamente.</p>';

/* Proyectos */
function tarjeta(p){
  let h='<article class="card"><h3>'+esc(p.nombre)+'</h3>';
  h+='<div><span class="chip">'+esc(p.tipo)+'</span><span class="chip st">'+esc(p.estado)+'</span></div>';
  h+='<div class="meta">'+[p.contexto,p.fecha].filter(Boolean).map(esc).join(" | ")+'</div>';
  if(p.problema)h+='<p>'+esc(p.problema)+'</p>';
  if(p.tecnologias)h+='<div class="meta">'+esc(p.tecnologias)+'</div>';
  if(/^https?:\/\//.test(p.enlace||""))h+='<a href="'+esc(p.enlace)+'" target="_blank" rel="noopener">Ver evidencia</a>';
  return h+'</article>';
}
$("#plist").innerHTML=S.proj.length?S.proj.map(tarjeta).join(""):'<div class="empty">Aún no hay proyectos.</div>';

/* CV: se muestra automáticamente si existe cv.pdf en el repositorio */
fetch("cv.pdf",{method:"HEAD"}).then(function(r){
  if(r.ok){$("#viewer").src="cv.pdf";$("#viewer").hidden=false;$("#acts").hidden=false;$("#nocv").hidden=true}
}).catch(function(){});
</script>
</body></html>
